name: Tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.scheme }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scheme: [kudosTests, kudosUITests]
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick newest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = [(k, v) for k, v in data.items() if ".iOS-" in k and v]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split(".iOS-")[1].split("-")])
          phones = [d for d in ios[-1][1] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Test
        run: |
          status=0
          xcodebuild test \
            -project kudos.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "TestResults-${{ matrix.scheme }}.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || status=$?
          # Full log is uploaded on failure; show only the useful lines here.
          grep -E "error:|warning:|failed|passed|\*\* (BUILD|TEST)" xcodebuild.log | tail -200 || true
          # Compiler errors and test failures as annotations, so they are
          # visible on the commit and readable through the public checks API.
          if [ $status -ne 0 ]; then
            python3 - "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          root = sys.argv[1].rstrip("/") + "/"
          seen = set()
          pat = re.compile(r"(/[^:\s]+\.swift):(\d+):(?:(\d+):)? (?:error|.*recorded an issue.*?):? ?(.*)")
          for line in open("xcodebuild.log", errors="replace"):
              if "error:" not in line and "recorded an issue" not in line and "failed" not in line:
                  continue
              m = pat.search(line)
              if m:
                  f, ln, col, msg = m.groups()
                  key = (f, ln, msg)
                  if key in seen:
                      continue
                  seen.add(key)
                  f = f.replace(root, "")
                  msg = (msg or line).strip().replace("%", "%25").replace("\n", " ")[:900]
                  print(f"::error file={f},line={ln},col={col or 1}::{msg}")
              elif "error:" in line and len(seen) < 40:
                  seen.add(line)
                  print("::error::" + line.strip().replace("%", "%25")[:900])
          PY
            # Test failures (with parallel testing) are only in the xcresult.
            xcrun xcresulttool get test-results summary \
              --path "TestResults-${{ matrix.scheme }}.xcresult" --format json > summary.json 2>/dev/null || true
            python3 - <<'PY'
          import json
          try:
              s = json.load(open("summary.json"))
          except Exception as e:
              print(f"::warning::no xcresult summary ({e})")
              raise SystemExit
          print(f"::notice::result={s.get('result')} passed={s.get('passedTests')} failed={s.get('failedTests')} skipped={s.get('skippedTests')}")
          for f in s.get("testFailures", [])[:20]:
              msg = f"{f.get('testName')}: {f.get('failureText')}".replace("%", "%25").replace("\n", " ")[:900]
              print(f"::error::{msg}")
          PY
          fi
          exit $status

      - name: Upload results
        if: ${{ !success() }}
        uses: actions/upload-artifact@v5
        with:
          name: TestResults-${{ matrix.scheme }}
          path: |
            TestResults-${{ matrix.scheme }}.xcresult
            xcodebuild.log
          retention-days: 7
